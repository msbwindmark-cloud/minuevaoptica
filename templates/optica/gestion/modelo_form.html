{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<form method="post" class="card p-3" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-outline-secondary" href="{% url 'optica:gestion_modelos' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
