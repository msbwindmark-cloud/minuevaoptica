{% extends "base.html" %}
{% block title %}Modo tienda{% endblock %}
{% block content %}
<div class="text-center">
  <h1 class="h2 mb-4">Catálogo en tienda</h1>
  <div id="kioscoCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
    <div class="carousel-inner">
      {% for m in destacados %}
      <div class="carousel-item {% if forloop.first %}active{% endif %}">
        <img src="{{ m.foto_portada.imagen.url }}" class="d-block mx-auto" style="max-height:60vh; object-fit:contain;" alt="{{ m.nombre }}">
        <div class="mt-3">
          <h2 class="h3">{{ m.marca }} {{ m.nombre }}</h2>
          <p class="h4 text-muted">{{ m.precio_display }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
