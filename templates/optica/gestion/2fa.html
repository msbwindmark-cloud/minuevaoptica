{% extends "base.html" %}
{% block title %}Verificación 2FA{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card p-4 shadow">
      <h1 class="h4 mb-3">Código de verificación</h1>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Código (Google Authenticator)</label>
          <input name="code" class="form-control" required autofocus>
        </div>
        <button class="btn btn-primary w-100">Verificar</button>
      </form>
      {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
    </div>
  </div>
</div>
{% endblock %}
