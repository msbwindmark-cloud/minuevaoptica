{% extends "base.html" %}
{% block title %}Editar página{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Editar {{ pagina.titulo }}</h1>
<form method="post" class="card p-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-outline-secondary" href="{% url 'optica:gestion_paginas' %}">Volver</a>
</form>
{% endblock %}
